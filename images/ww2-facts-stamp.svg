<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760">
  <title>a postage stamp with a postmark</title>
  <rect width="800" height="760" fill="#f3efe6"/>
  <!-- stamp with perforated edge -->
  <g transform="translate(170 90)">
    <rect x="0" y="0" width="400" height="500" fill="#fffdf8"/>
    <g fill="#f3efe6">
      <circle cx="0" cy="0" r="0"/>
    </g>
    <path d="M0 0 h400 v500 h-400 Z" fill="none" stroke="#c9b99a" stroke-width="2"/>
    <g fill="#f3efe6">
      <!-- perforations -->
      <circle cx="20" cy="0" r="10"/><circle cx="60" cy="0" r="10"/><circle cx="100" cy="0" r="10"/><circle cx="140" cy="0" r="10"/><circle cx="180" cy="0" r="10"/><circle cx="220" cy="0" r="10"/><circle cx="260" cy="0" r="10"/><circle cx="300" cy="0" r="10"/><circle cx="340" cy="0" r="10"/><circle cx="380" cy="0" r="10"/>
      <circle cx="20" cy="500" r="10"/><circle cx="60" cy="500" r="10"/><circle cx="100" cy="500" r="10"/><circle cx="140" cy="500" r="10"/><circle cx="180" cy="500" r="10"/><circle cx="220" cy="500" r="10"/><circle cx="260" cy="500" r="10"/><circle cx="300" cy="500" r="10"/><circle cx="340" cy="500" r="10"/><circle cx="380" cy="500" r="10"/>
      <circle cx="0" cy="25" r="10"/><circle cx="0" cy="75" r="10"/><circle cx="0" cy="125" r="10"/><circle cx="0" cy="175" r="10"/><circle cx="0" cy="225" r="10"/><circle cx="0" cy="275" r="10"/><circle cx="0" cy="325" r="10"/><circle cx="0" cy="375" r="10"/><circle cx="0" cy="425" r="10"/><circle cx="0" cy="475" r="10"/>
      <circle cx="400" cy="25" r="10"/><circle cx="400" cy="75" r="10"/><circle cx="400" cy="125" r="10"/><circle cx="400" cy="175" r="10"/><circle cx="400" cy="225" r="10"/><circle cx="400" cy="275" r="10"/><circle cx="400" cy="325" r="10"/><circle cx="400" cy="375" r="10"/><circle cx="400" cy="425" r="10"/><circle cx="400" cy="475" r="10"/>
    </g>
    <rect x="40" y="40" width="320" height="420" fill="#2f4a3a"/>
    <text x="200" y="210" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#f3efe6" text-anchor="middle">1941</text>
    <text x="200" y="270" font-family="Georgia, serif" font-size="30" fill="#e3d9c3" text-anchor="middle">TODAY'S TOPIC</text>
    <rect x="90" y="310" width="220" height="6" fill="#c98a1b"/>
    <text x="200" y="380" font-family="Georgia, serif" font-size="26" fill="#e3d9c3" text-anchor="middle">Home Front</text>
  </g>
  <!-- postmark -->
  <g transform="translate(560 200)" fill="none" stroke="#1d2433" stroke-opacity=".55" stroke-width="5">
    <circle r="90"/><circle r="70"/>
    <path d="M110 -30 q40 -20 80 0 t80 0 M110 0 q40 -20 80 0 t80 0 M110 30 q40 -20 80 0 t80 0"/>
  </g>
  <rect x="80" y="680" width="640" height="46" rx="10" fill="#fff3bf" stroke="#b08900" stroke-width="2"/>
</svg>
