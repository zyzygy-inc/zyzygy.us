<text x="210.0" y="300" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="29" font-weight="800" fill="#1d2433">George Washington</text>
<text x="210.0" y="330" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f3a68">1st President</text>
<text x="210.0" y="356" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="18" fill="#4a5568">1789–1797</text>
<rect x="44" y="384" width="332" height="110" rx="12" fill="#fff" stroke="#ddd5c4"/>
<text x="60" y="412" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" fill="#1d2433">Before becoming president, he</text>
<text x="60" y="435" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" fill="#1d2433">commanded the Continental Army</text>
<text x="60" y="458" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" fill="#1d2433">during the American</text>
<text x="60" y="481" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" fill="#1d2433">Revolutionary War.</text>
<rect x="44" y="504" width="332" height="87" rx="12" fill="#fff" stroke="#ddd5c4"/>
<text x="60" y="532" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" fill="#1d2433">He presided over the</text>
<text x="60" y="555" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" fill="#1d2433">Constitutional Convention in</text>
<text x="60" y="578" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" fill="#1d2433">Philadelphia in 1787.</text>
<rect x="44" y="601" width="332" height="87" rx="12" fill="#fff" stroke="#ddd5c4"/>
<text x="60" y="629" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" fill="#1d2433">He took his first oath of office</text>
<text x="60" y="652" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" fill="#1d2433">in New York City, which was</text>
<text x="60" y="675" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="17" fill="#1d2433">then the nation's capital.</text>
<rect x="44" y="702" width="332" height="52" rx="14" fill="#1f3a68"/>
<text x="210.0" y="735" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Next fact</text>
